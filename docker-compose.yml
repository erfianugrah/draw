# docker-compose.yml
# ==================
# Headless deployment — no built-in reverse proxy.
# External Caddy (or any reverse proxy) handles TLS and routing.
# All services expose ports on the host.
#
# Usage:
#   docker compose up -d --build
#
# Deployed on Unraid via Composer (ghcr.io/erfianugrah/composer).

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: excalidraw-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    environment:
      - TZ=${TZ:-UTC}

  excalidraw-room:
    build:
      context: ./excalidraw-room
      dockerfile: Dockerfile
    container_name: excalidraw-collab
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - CORS_ORIGIN=*
      - TZ=${TZ:-UTC}

  excalidraw-storage:
    build:
      context: ./excalidraw-storage
      dockerfile: Dockerfile
    container_name: excalidraw-storage
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - CORS_ORIGIN=*
      - TZ=${TZ:-UTC}
      - API_KEY=${API_KEY:-}
      - ROOM_MAX_AGE_DAYS=${ROOM_MAX_AGE_DAYS:-30}
      - EXPORT_MAX_AGE_DAYS=${EXPORT_MAX_AGE_DAYS:-30}
      - DRAWING_MAX_AGE_DAYS=${DRAWING_MAX_AGE_DAYS:-90}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
    volumes:
      - excalidraw-data:/app/data

  excalidraw-ai:
    build:
      context: ./excalidraw-ai
      dockerfile: Dockerfile
    container_name: excalidraw-ai
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - CORS_ORIGIN=*
      - TZ=${TZ:-UTC}
      - API_KEY=${API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL:-gpt-4o}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-haiku-20241022}
      - ANTHROPIC_VISION_MODEL=${ANTHROPIC_VISION_MODEL:-claude-sonnet-4-20250514}
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-llava}
      - AI_RATE_LIMIT_PER_DAY=${AI_RATE_LIMIT_PER_DAY:-100}
    volumes:
      - ai-data:/app/data

volumes:
  excalidraw-data:
  ai-data:
